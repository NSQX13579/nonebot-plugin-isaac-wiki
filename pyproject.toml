[project]
name = "nonebot-plugin-isaac-wiki"
version = "0.3.0"
description = "查询《以撒的结合》中文 wiki 的 NoneBot2 插件（道具/饰品/卡牌/胶囊/角色/怪物/房间/成就）"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "ns", email = "102937666+NSQX13579@users.noreply.github.com" },
]
keywords = ["nonebot", "nonebot2", "isaac", "wiki"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "nonebot2>=2.4.0",
    "pydantic>=2.0",
    "beautifulsoup4>=4.12",
    "nonebot-plugin-localstore>=0.7.0",
]

[project.optional-dependencies]
# 卡片截图所需（不装则回退为纯文本）
browser = [
    "playwright>=1.40",
]
test = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nonebot_plugin_isaac_wiki"]

[tool.nonebot]
name = "以撒 wiki 查询"
module_name = "nonebot_plugin_isaac_wiki"
description = "查询以撒的结合中文 wiki：道具、饰品、卡牌、胶囊、角色、怪物、房间、成就"
usage = """
以撒 硫磺火
"""
homepage = ""
supported_adapters = ["~onebot.v11"]
version = "0.3.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
